<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-label="B. D. Oboh Integrity Farm">
  <g>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25553a"/>
      <stop offset="1" stop-color="#0f2a1a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fdc6e"/>
      <stop offset="1" stop-color="#4a9429"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg)"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="#d4a72c" stroke-width="2"/>
  <!-- rising sun -->
  <path d="M26 84 A34 34 0 0 1 94 84 Z" fill="#d4a72c" fill-opacity=".18"/>
  <!-- cassava palmate leaf: 7 leaflets -->
  <g fill="url(#leaf)">
    <ellipse cx="60" cy="45" rx="5.2" ry="20" transform="rotate(-78 60 68)"/>
    <ellipse cx="60" cy="45" rx="5.6" ry="21" transform="rotate(-52 60 68)"/>
    <ellipse cx="60" cy="45" rx="5.8" ry="22" transform="rotate(-26 60 68)"/>
    <ellipse cx="60" cy="43" rx="6" ry="23"/>
    <ellipse cx="60" cy="45" rx="5.8" ry="22" transform="rotate(26 60 68)"/>
    <ellipse cx="60" cy="45" rx="5.6" ry="21" transform="rotate(52 60 68)"/>
    <ellipse cx="60" cy="45" rx="5.2" ry="20" transform="rotate(78 60 68)"/>
  </g>
  <!-- leaflet veins -->
  <g stroke="#14321f" stroke-opacity=".35" stroke-width=".9" stroke-linecap="round">
    <path d="M60 68 V22"/>
    <path d="M60 68 L60 68" />
    <path d="M60 68 L40.6 28" transform="rotate(0)"/>
    <path d="M60 68 L79.4 28"/>
    <path d="M60 68 L26 44"/>
    <path d="M60 68 L94 44"/>
    <path d="M60 68 L19 62"/>
    <path d="M60 68 L101 62"/>
  </g>
  <!-- stem -->
  <path d="M60 68 V86" stroke="#f1e6c5" stroke-width="3.2" stroke-linecap="round"/>
  <!-- cassava tubers -->
  <path d="M30 92 Q58 80 92 90 Q60 103 30 92 Z" fill="#a8723a"/>
  <path d="M38 91 Q60 85 84 90" fill="none" stroke="#6f4a28" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="91" cy="90" rx="2.2" ry="1.6" fill="#f6efdc"/>
  <ellipse cx="31" cy="92" rx="2.2" ry="1.6" fill="#f6efdc"/>
</g>
  <text x="136" y="62" font-family="Georgia, 'Playfair Display', serif" font-size="40" font-weight="700" fill="#14321f">B. D. Oboh</text>
  <text x="138" y="92" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="6" fill="#4a9429">INTEGRITY FARM</text>
</svg>